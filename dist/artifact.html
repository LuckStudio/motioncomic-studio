<title>MotionComic Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap">
<style>
/* MotionComic Studio · estilos. Concepto: sala de edición oscura; el violeta solo aparece donde hay acción o marca (brandbook v0.1). */
:root {
  --bg: #0F1012;
  --panel: #17191C;
  --raised: #1F2226;
  --line: #2A2E33;
  --fg: #ECEEF0;
  --muted: #9AA0A8;
  --accent: #8C7CFF;
  --accent-hover: #A094FF;
  --on-accent: #0F1012;
  --accent-tint: rgba(140, 124, 255, 0.16);
  --stage: #0B0C0E;
  --clip: #ECEEF0;
  --clip-ink: #0F1012;
  --aux: #5B6068;
  --good: #5FD3A0;
  --warn: #E5B454;
  --bad: #FF7B7B;
  --font: 'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F3F4F6; --panel: #FFFFFF; --raised: #EEF0F3; --line: #D8DBE1; --fg: #15171A; --muted: #5B6068;
    --accent: #6A59E8; --accent-hover: #5646D6; --on-accent: #FFFFFF; --accent-tint: rgba(106, 89, 232, 0.14);
    --clip: #15171A; --clip-ink: #F3F4F6; --aux: #9AA0A8; --good: #168A5C; --warn: #9A6A00; --bad: #C93A3A;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F3F4F6; --panel: #FFFFFF; --raised: #EEF0F3; --line: #D8DBE1; --fg: #15171A; --muted: #5B6068;
  --accent: #6A59E8; --accent-hover: #5646D6; --on-accent: #FFFFFF; --accent-tint: rgba(106, 89, 232, 0.14);
  --clip: #15171A; --clip-ink: #F3F4F6; --aux: #9AA0A8; --good: #168A5C; --warn: #9A6A00; --bad: #C93A3A;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); font-variant-numeric: tabular-nums; }
#app {
  height: 100%; overflow: auto;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.03em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.cap { font-size: 13px; color: var(--muted); }
.num { font-weight: 500; font-variant-numeric: tabular-nums; }
svg.i { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* botones y controles */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; border: 1px solid transparent; border-radius: 10px; padding: 8px 16px; cursor: pointer; background: none; white-space: nowrap; }
.btn-p { background: var(--accent); color: var(--on-accent); }
.btn-p:hover { background: var(--accent-hover); }
.btn-s { background: var(--raised); border-color: var(--line); }
.btn-s:hover { border-color: var(--accent); }
.btn-g { color: var(--muted); padding-inline: 10px; }
.btn-g:hover { color: var(--fg); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn-ic { padding: 7px; width: 34px; height: 34px; }
.btn-sm { padding: 5px 10px; font-size: 13px; }
.btn-danger { color: var(--bad); }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; }
.seg button { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--fg); font-weight: 600; }
.seg button[disabled] { opacity: .4; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-b { border: 1px solid var(--line); background: var(--raised); color: var(--fg); font-size: 13px; padding: 5px 11px; border-radius: 999px; cursor: pointer; }
.chip-b:hover { border-color: var(--accent); }
.chip-b[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-tint); font-weight: 600; }
.chip-b[disabled] { opacity: .4; cursor: not-allowed; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; background: var(--raised); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .slider > label { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.slider > label span { color: var(--muted); font-weight: 500; }
.slider input[type=range] { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
.input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.input:focus { border-color: var(--accent); outline: none; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); margin-top: 3px; }
.check small { display: block; color: var(--muted); font-size: 12px; }
.warn { color: var(--warn); } .bad { color: var(--bad); } .good { color: var(--good); }

/* barra superior común */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
.brand span { color: var(--muted); font-weight: 500; }
.mark-a { stroke: var(--fg); fill: none; } .mark-b { fill: var(--accent); }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* inicio */
.home { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; padding-bottom: 48px; }
.home-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 16px; }
.home-head h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.05; font-weight: 700; }
.home-head p { color: var(--muted); max-width: 52ch; margin-top: 8px; }
.notice { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; display: flex; gap: 12px 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.notice .meter { height: 6px; width: 160px; background: var(--raised); border-radius: 99px; overflow: hidden; }
.notice .meter i { display: block; height: 100%; background: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; grid-template-rows: auto auto; min-width: 0; }
.card:hover, .card:focus-within { border-color: var(--aux); }
.card .thumb { position: relative; background: var(--stage); aspect-ratio: 16 / 10; display: grid; place-items: center; border: 0; padding: 0; cursor: pointer; width: 100%; }
.card .thumb img { max-width: 100%; max-height: 100%; display: block; }
.card .info { padding: 12px 14px 12px; display: grid; gap: 8px; min-width: 0; }
.card .nm { font-weight: 600; font-size: 16px; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.card .acts { display: flex; gap: 2px; margin-left: -8px; }
.card .confirm { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 40px 20px; text-align: center; display: grid; gap: 14px; justify-items: center; color: var(--muted); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.steps > div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 4px; align-content: start; }
.steps b { font-size: 15px; letter-spacing: -0.01em; }
.steps span { font-size: 13px; color: var(--muted); }

/* modal y aviso */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: grid; place-items: center; padding: 16px; z-index: 50; overflow: auto; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(560px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 18px; padding: 22px; }
.modal h2 { font-size: 24px; line-height: 1.15; }
.modal .row-end { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--raised); border-radius: 12px; padding: 10px 12px; display: grid; gap: 3px; cursor: pointer; }
.mode b { font-size: 14px; } .mode span { font-size: 12px; color: var(--muted); }
.mode[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-tint); }
.mode[disabled] { opacity: .5; cursor: not-allowed; }
.calc { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; font-size: 14px; }
.calc .big { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 60; max-width: calc(100% - 32px); }

/* estudio */
.studio { height: 100%; min-height: 520px; display: grid; grid-template-rows: auto minmax(0, 1fr) var(--tl-h, 274px); border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; }
.studio[data-ws="capas"] { --tl-h: 224px; }
.s-top { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.s-top .ttl { background: transparent; border: 1px solid transparent; border-radius: 8px; font-weight: 600; font-size: 14px; padding: 5px 8px; width: min(220px, 26vw); min-width: 90px; }
.s-top .ttl:hover, .s-top .ttl:focus { border-color: var(--line); outline: none; background: var(--bg); }
.s-tabs { display: flex; gap: 2px; }
.s-tabs button { border: 0; border-radius: 8px; padding: 6px 12px; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap; }
.s-tabs button[aria-selected="true"] { background: var(--line); color: var(--fg); font-weight: 600; }
.s-tabs button[disabled] { opacity: .4; cursor: not-allowed; }
.s-top .sp { flex: 1; }
.s-main { display: grid; grid-template-columns: 236px minmax(0, 1fr) 312px; min-height: 0; border-bottom: 1px solid var(--line); }
.studio[data-ws="capas"] .s-main { grid-template-columns: 280px minmax(0, 1fr) 360px; }
.panel-col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.p-layers { border-right: 1px solid var(--line); }
.p-inspector { border-left: 1px solid var(--line); }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 6px; }
.pbody { overflow: auto; padding: 4px 12px 14px; display: grid; gap: 4px; align-content: start; min-height: 0; flex: 1; }
.layer { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 14px; cursor: pointer; border: 1px solid transparent; min-width: 0; }
.layer:hover { background: var(--raised); }
.layer.on { background: var(--raised); border-color: var(--line); font-weight: 600; }
.layer .lt { width: 34px; height: 34px; border-radius: 5px; background: var(--stage); object-fit: cover; flex: none; border: 1px solid var(--line); }
.layer .ln { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer .lz { color: var(--muted); font-weight: 500; font-size: 13px; }
.layer.off .ln, .layer.off .lt { opacity: .45; }
.layer .btn { padding: 3px; width: 26px; height: 26px; }
.lrow { display: flex; gap: 2px; padding: 2px 0 6px 8px; }
.sec { border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; }
.sec > button.sh { display: flex; width: 100%; justify-content: space-between; align-items: center; background: none; border: 0; padding: 12px 0 8px; cursor: pointer; color: var(--muted); }
.sec > button.sh:hover { color: var(--fg); }
.sec .sb { display: grid; gap: 12px; padding: 4px 0 14px; }
.sec[data-open="false"] .sb { display: none; }
.pbody.insp { padding-top: 0; }

.viewer { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--stage); min-width: 0; min-height: 0; }
.vbar, .tbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex-wrap: wrap; color: #ECEEF0; }
.viewer .seg { background: #0F1012; border-color: #2A2E33; }
.viewer .seg button { color: #9AA0A8; } .viewer .seg button[aria-pressed="true"] { background: #1F2226; color: #ECEEF0; }
.viewer .btn-g { color: #9AA0A8; } .viewer .btn-g:hover { color: #ECEEF0; }
.viewer .btn-g[aria-pressed="true"] { color: var(--accent); }
.viewer .status { color: #9AA0A8; }
.stage { position: relative; min-height: 0; min-width: 0; display: grid; place-items: center; padding: 6px 12px; overflow: hidden; }
.stage canvas { display: block; border-radius: 3px; touch-action: none; background: #000; }
.stage .drop { position: absolute; inset: 8px 12px; border: 2px dashed #2A2E33; border-radius: 10px; display: grid; place-items: center; text-align: center; color: #9AA0A8; padding: 16px; pointer-events: none; }
.stage .drop .in { display: grid; gap: 12px; justify-items: center; pointer-events: auto; }
.stage.over .drop { border-color: var(--accent); color: #ECEEF0; }
.tbar { justify-content: center; gap: 12px; }
.play { width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; cursor: pointer; }
.tbar .num { color: #ECEEF0; font-size: 14px; }
.tbar .num span { color: #9AA0A8; }

/* línea de tiempo */
.p-timeline { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tl-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
.tl-head .num { margin-left: auto; font-size: 14px; }
.tl-body { display: grid; grid-template-columns: 136px minmax(0, 1fr); overflow-y: auto; overflow-x: hidden; min-height: 0; flex: 1; padding-bottom: 8px; }
.tl-labels { display: grid; grid-auto-rows: 34px; padding-left: 12px; }
.tl-labels .rs { height: 24px; }
.tl-labels div { font-size: 12px; color: var(--muted); display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-scroll { overflow-x: auto; overflow-y: hidden; padding-right: 12px; }
.tl-content { position: relative; min-width: 100%; }
.tl-ruler { height: 24px; position: relative; border-bottom: 1px solid var(--line); cursor: ew-resize; touch-action: none; }
.tl-ruler b { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); padding: 2px 0 0 4px; font-size: 11px; font-weight: 500; color: var(--muted); }
.tl-track { height: 34px; position: relative; border-bottom: 1px solid var(--line); background: var(--bg); background-image: none; touch-action: none; }
.tl-track.off::after { content: attr(data-hint); position: absolute; inset: 0; display: flex; align-items: center; padding-left: 10px; font-size: 12px; color: var(--aux); pointer-events: none; }
.clip { position: absolute; top: 4px; bottom: 4px; border-radius: 6px; background: var(--clip); color: var(--clip-ink); font-size: 12px; font-weight: 600; padding: 0 12px 0 8px; display: flex; align-items: center; overflow: hidden; cursor: pointer; border: 2px solid transparent; user-select: none; }
.clip.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.clip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clip .rz { position: absolute; right: 0; top: 0; bottom: 0; width: 10px; cursor: ew-resize; touch-action: none; }
.clip .rz::after { content: ""; position: absolute; right: 3px; top: 25%; bottom: 25%; width: 2px; border-radius: 2px; background: currentColor; opacity: .4; }
.clip.fx { background: var(--accent); color: var(--on-accent); }
.tr-mark { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .85; pointer-events: none; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; z-index: 3; }
.playhead::before { content: ""; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top-color: var(--accent); border-bottom: 0; }

/* narrow */
.mtabs { display: none; }
@media (max-width: 1100px) { .s-tabs { display: none; } }
@media (max-width: 900px) {
  .studio { grid-template-rows: auto minmax(230px, 42%) auto minmax(0, 1fr); min-height: 700px; }
  .s-main { display: contents; }
  .viewer { grid-row: 2; }
  .mtabs { display: flex; grid-row: 3; gap: 4px; padding: 6px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .mtabs button { flex: 1; border: 0; padding: 8px; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 500; cursor: pointer; }
  .mtabs button[aria-pressed="true"] { background: var(--line); color: var(--fg); font-weight: 600; }
  .p-layers, .p-inspector, .p-timeline { grid-row: 4; display: none; border: 0; }
  .studio[data-mtab="layers"] .p-layers, .studio[data-mtab="inspector"] .p-inspector, .studio[data-mtab="timeline"] .p-timeline { display: flex; min-height: 0; }
  .s-top .ttl { width: 120px; }
  .s-top .hide-n, .s-top .status { display: none; }
  .tl-body { grid-template-columns: 96px minmax(0, 1fr); }
}
@media (pointer: coarse) { .btn-sm, .seg button, .chip-b { min-height: 36px; } .layer .btn { width: 34px; height: 34px; } }
@media (prefers-reduced-motion: no-preference) {
  .btn, .seg button, .chip-b, .card { transition: background .15s, border-color .15s, color .15s; }
}

</style>

<script>window.MC_PREVIEW = true;</script>
<script>
/* Utilidades base: idioma, DOM, iconos, avisos y ventanas. Sin dependencias. */
(function () {
  const MC = (window.MC = window.MC || {});

  MC.lang = 'es';
  MC.t = (es, en) => (MC.lang === 'en' ? (en == null ? es : en) : es);
  MC.uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
  MC.clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  MC.lerp = (a, b, t) => a + (b - a) * t;
  MC.store = {
    get(k, d) { try { const v = localStorage.getItem('mc.' + k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('mc.' + k, v); } catch (e) { /* sin almacenamiento */ } },
  };

  const pad = (n) => String(n).padStart(2, '0');
  MC.fmtTime = (s, fps) => {
    fps = fps || 30;
    s = Math.max(0, s);
    return pad(Math.floor(s / 60)) + ':' + pad(Math.floor(s % 60)) + ':' + pad(Math.floor((s % 1) * fps));
  };
  MC.fmtClock = (ts) => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  MC.fmtDate = (ts) => new Date(ts).toLocaleDateString(MC.lang === 'en' ? 'en-GB' : 'es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
  MC.fmtBytes = (b) => (b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(0) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB');

  /* h('div', {class:'x', onClick: fn}, hijos...) */
  const LAST = { value: 1, checked: 1 };
  MC.h = function h(tag, props) {
    const el = document.createElement(tag);
    if (props) {
      const keys = Object.keys(props).sort((a, b) => (LAST[a] ? 1 : 0) - (LAST[b] ? 1 : 0));
      for (const k of keys) {
        const v = props[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'hidden') el[k] = v;
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (let i = 2; i < arguments.length; i++) {
      const stack = [arguments[i]];
      while (stack.length) {
        const c = stack.shift();
        if (c == null || c === false) continue;
        if (Array.isArray(c)) stack.unshift(...c);
        else el.append(c.nodeType ? c : document.createTextNode(String(c)));
      }
    }
    return el;
  };
  const h = MC.h;
  /* Añade hijos ignorando null/false y aplanando listas (append nativo escribiría «null»). */

/* Formatos, resolución y calculadora (PRD 5.5). */
(function () {
  const MC = window.MC;
  const { h, t } = MC;

  MC.RATIOS = ['16:9', '9:16', '3:4', '1:1', '2:1'];
  MC.RES = { '1080p': 1080, '2K': 1440, '4K': 2160 }; // lado corto en px
  MC.RATIO_HINT = {
    '9:16': ['TikTok, Reels y Shorts', 'TikTok, Reels and Shorts'],
    '16:9': ['YouTube y pantallas', 'YouTube and screens'],
    '3:4': ['Instagram feed vertical', 'Vertical Instagram feed'],
    '1:1': ['Instagram feed cuadrado', 'Square Instagram feed'],
    '2:1': ['Panorámico', 'Panoramic'],
  };

  MC.parseRatio = (r) => {
    const p = String(r).split(':').map(Number);
    return p.length === 2 && p[0] > 0 && p[1] > 0 ? p : [16, 9];
  };
  const even = (n) => Math.max(2, Math.round(n / 2) * 2);
  MC.frameSize = (ratio, res) => {
    const [rw, rh] = MC.parseRatio(ratio);
    const short = MC.RES[res] || 1080;
    return rw >= rh ? { w: even((short * rw) / rh), h: short } : { w: short, h: even((short * rh) / rw) };
  };

  /* Selector de formato con calculadora. state = {ratio,res,zoom}; onChange se llama con cada cambio. */
  MC.formatPicker = (state, onChange) => {
    const root = h('div', { style: { display: 'grid', gap: '14px' } });
    const isPreset = () => MC.RATIOS.includes(state.ratio);
    const draw = () => {
      MC.clear(root);
      const size = MC.frameSize(state.ratio, state.res);
      const set = (k, v) => { state[k] = v; draw(); onChange && onChange(state); };
      const [cw, ch] = MC.parseRatio(state.ratio);
      const idW = 'cw-' + MC.uid(), idH = 'ch-' + MC.uid();
      MC.put(root,
        h('div', { class: 'field' }, h('span', { class: 'eyebrow' }, t('Proporción', 'Aspect ratio')),
          MC.ui.chips(MC.RATIOS.map((r) => ({ v: r, l: r })).concat([{ v: 'custom', l: t('Personalizada', 'Custom') }]), isPreset() ? state.ratio : 'custom', (v) => set('ratio', v === 'custom' ? '5:4' : v))),
        !isPreset() ? h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center' } },
          h('input', { class: 'input', id: idW, type: 'number', min: 1, max: 40, value: cw, 'aria-label': t('Ancho', 'Width'), style: { width: '80px' }, onChange: (e) => set('ratio', Math.max(1, Math.round(+e.target.value || 1)) + ':' + ch) }),
          h('span', null, ':'),
          h('input', { class: 'input', id: idH, type: 'number', min: 1, max: 40, value: ch, 'aria-label': t('Alto', 'Height'), style: { width: '80px' }, onChange: (e) => set('ratio', cw + ':' + Math.max(1, Math.round(+e.target.value || 1))) })) : null,
        h('div', { class: 'field' }, h('span', { class: 'eyebrow' }, t('Resolución de salida', 'Output resolution')),
          MC.ui.seg(Object.keys(MC.RES).map((r) => ({ v: r, l: r })), state.res, (v) => set('res', v), t('Resolución', 'Resolution'))),
        MC.ui.slider({ label: t('Zoom previsto', 'Planned zoom'), min: 1, max: 3, step: 0.1, value: state.zoom, fmt: (v) => '×' + v.toFixed(1), onInput: (v) => { state.zoom = v; refreshCalc(); }, onChange: () => onChange && onChange(state) }),
        calcBox(),
      );
    };
    let calc;
    const calcBox = () => { calc = h('div', { class: 'calc', 'aria-live': 'polite' }); refreshCalc(); return calc; };
    const refreshCalc = () => {
      if (!calc) return;
      const s = MC.frameSize(state.ratio, state.res);
      const need = (z) => Math.ceil(s.w * z) + ' × ' + Math.ceil(s.h * z);
      MC.clear(calc);
      MC.put(calc,
        h('span', { class: 'cap' }, t('Tamaño del vídeo', 'Video size')),
        h('span', { class: 'big' }, s.w + ' × ' + s.h + ' px'),
        h('span', { class: 'cap', style: { marginTop: '6px' } }, t('Ilustración mínima para no pixelarse con el zoom previsto', 'Minimum artwork size to avoid pixelation at the planned zoom')),
        h('div', { class: 'calc-grid' },
          h('div', null, h('div', { class: 'cap' }, 'zoom ×1.0'), h('b', null, need(1))),
          h('div', null, h('div', { class: 'cap' }, 'zoom ×' + state.zoom.toFixed(1)), h('b', { class: 'good' }, need(state.zoom)))),
        MC.RATIO_HINT[state.ratio] ? h('span', { class: 'cap', style: { marginTop: '6px' } }, t(MC.RATIO_HINT[state.ratio][0], MC.RATIO_HINT[state.ratio][1])) : null,
      );
    };
    draw();
    return root;
  };
})();

/* Guardado local: IndexedDB para proyectos e imágenes (PRD 13). Si el navegador no lo permite, trabaja en memoria y avisa. */
(function () {
  const MC = window.MC;
  const mem = { projects: new Map(), assets: new Map() };
  let dbp = null;
  const db = (MC.db = { persistent: true });

  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const r = indexedDB.open('motioncomic', 1);
        r.onupgradeneeded = () => {
          r.result.createObjectStore('projects', { keyPath: 'id' });
          r.result.createObjectStore('assets', { keyPath: 'id' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = r.onblocked = () => { db.persistent = false; res(null); };
      } catch (e) { db.persistent = false; res(null); }
    });
    return dbp;
  }
  async function run(store, mode, op) {
    const d = await open();
    if (!d) return undefined;
    return new Promise((res, rej) => {
      const tx = d.transaction(store, mode);
      const req = op(tx.objectStore(store));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = tx.onabort = () => rej(tx.error);
    });
  }
  db.put = async (store, val) => { if (!(await open())) { mem[store].set(val.id, val); return; } await run(store, 'readwrite', (s) => s.put(val)); };
  db.get = async (store, id) => ((await open()) ? run(store, 'readonly', (s) => s.get(id)) : mem[store].get(id));
  db.all = async (store) => ((await open()) ? run(store, 'readonly', (s) => s.getAll()) : [...mem[store].values()]);
  db.del = async (store, id) => { if (!(await open())) { mem[store].delete(id); return; } await run(store, 'readwrite', (s) => s.delete(id)); };

  db.ready = async () => {
    const d = await open();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* opcional */ }
    return !!d;
  };
  db.usage = async () => {
    try { const e = await navigator.storage.estimate(); return { used: e.usage || 0, quota: e.quota || 0 }; } catch (e) { return null; }
  };

  /* Imágenes: el archivo original se guarda tal cual, sin recomprimir. */
  const cache = new Map();
  MC.assets = {
    cache,
    get: (id) => cache.get(id) || null,
    async load(id) {
      if (cache.has(id)) return cache.get(id);
      const rec = await db.get('assets', id);
      if (!rec) return null;
      const bitmap = await createImageBitmap(rec.blob);
      const a = { id, name: rec.name, w: bitmap.width, h: bitmap.height, bitmap, thumb: rec.thumb };
      cache.set(id, a);
      return a;
    },
    async add(blob, name, existingId) {
      const bitmap = await createImageBitmap(blob);
      const id = existingId || MC.uid();
      const c = document.createElement('canvas');
      const k = 72 / Math.max(bitmap.width, bitmap.height);
      c.width = Math.max(1, Math.round(bitmap.width * k));
      c.height = Math.max(1, Math.round(bitmap.height * k));
      c.getContext('2d').drawImage(bitmap, 0, 0, c.width, c.height);
      const thumb = c.toDataURL('image/png');
      await db.put('assets', { id, name, blob, type: blob.type, w: bitmap.width, h: bitmap.height, thumb });
      const a = { id, name, w: bitmap.width, h: bitmap.height, bitmap, thumb };
      cache.set(id, a);
      return a;
    },
  };

  MC.projectAssetIds = (p) => {
    const ids = new Set();
    p.shots.forEach((s) => s.layers.forEach((l) => ids.add(l.assetId)));
    return ids;
  };
  MC.loadProjectAssets = (p) => Promise.all([...MC.projectAssetIds(p)].map((id) => MC.assets.load(id)));

  /* Modelo de proyecto */
  MC.newCamera = () => ({ preset: 'zoomin', intensity: 1, curve: 'smooth', from: { x: 0, y: 0, zoom: 1, rot: 0 }, to: { x: 0, y: 0, zoom: 1.25, rot: 0 }, shake: 0 });
  MC.newShot = (name) => ({ id: MC.uid(), name: name || 'Plano', duration: 4, layers: [], camera: MC.newCamera(), transition: { type: 'cut', dur: 0.6 } });
  MC.newProject = (o) => ({
    id: MC.uid(), name: o.name || 'Proyecto sin título', mode: 'free', ratio: o.ratio || '9:16', res: o.res || '1080p', zoomPlan: o.zoom || 1.5,
    parallax: 'normal', overscan: true, created: Date.now(), updated: Date.now(), shots: [MC.newShot('Plano 1')], thumb: '',
  });

  /* Presets de cámara (PRD 8) */
  MC.CAM_PRESETS = [
    { v: 'none', es: 'Quieta', en: 'Still' }, { v: 'zoomin', es: 'Zoom in', en: 'Zoom in' }, { v: 'zoomout', es: 'Zoom out', en: 'Zoom out' },
    { v: 'panl', es: 'Paneo ←', en: 'Pan ←' }, { v: 'panr', es: 'Paneo →', en: 'Pan →' }, { v: 'panu', es: 'Paneo ↑', en: 'Pan ↑' }, { v: 'pand', es: 'Paneo ↓', en: 'Pan ↓' },
    { v: 'kenburns', es: 'Ken Burns', en: 'Ken Burns' }, { v: 'shake', es: 'Temblor', en: 'Shake' }, { v: 'dutch', es: 'Ángulo holandés', en: 'Dutch angle' },
  ];
  MC.applyPreset = (cam, preset, intensity) => {
    const i = MC.clamp(intensity == null ? cam.intensity || 1 : intensity, 0.2, 2);
    const K = (x, y, zoom, rot) => ({ x, y, zoom, rot: rot || 0 });
    cam.preset = preset; cam.intensity = i; cam.shake = 0;
    const P = {
      none: () => [K(0, 0, 1), K(0, 0, 1)],
      zoomin: () => [K(0, 0, 1), K(0, 0, 1 + 0.3 * i)],
      zoomout: () => [K(0, 0, 1 + 0.3 * i), K(0, 0, 1)],
      panl: () => [K(0.07 * i, 0, 1.2), K(-0.07 * i, 0, 1.2)],
      panr: () => [K(-0.07 * i, 0, 1.2), K(0.07 * i, 0, 1.2)],
      panu: () => [K(0, 0.07 * i, 1.2), K(0, -0.07 * i, 1.2)],
      pand: () => [K(0, -0.07 * i, 1.2), K(0, 0.07 * i, 1.2)],
      kenburns: () => [K(-0.015 * i, 0.01 * i, 1), K(0.02 * i, -0.015 * i, 1 + 0.15 * i)],
      shake: () => { cam.shake = i; return [K(0, 0, 1.06), K(0, 0, 1.06)]; },
      dutch: () => [K(0, 0, 1.12, 0), K(0, 0, 1.15, 6 * i)],
    };
    if (P[preset]) { const r = P[preset](); cam.from = r[0]; cam.to = r[1]; }
    return cam;
  };

  MC.detectLayer = (name) => {
    const n = String(name).toLowerCase();
    if (/cielo|sky/.test(n)) return { z: 0, role: 'fondo' };
    if (/fondo|bg|background/.test(n)) return { z: 0.1, role: 'fondo' };
    if (/lejan|far/.test(n)) return { z: 0.25, role: '' };
    if (/edif|ciudad|building/.test(n)) return { z: 0.4, role: '' };
    if (/personaje|char|figura/.test(n)) return { z: 0.6, role: '' };
    if (/primer|fore|front/.test(n)) return { z: 0.92, role: '' };
    if (/texto|bocadillo|sfx|text|bubble/.test(n)) return { z: 0.9, role: '' };
    return null;
  };
  MC.newLayer = (asset, hint) => {
    const d = MC.detectLayer(asset.name) || hint || { z: 0.5, role: '' };
    return { id: MC.uid(), name: asset.name.replace(/\.[a-z0-9]+$/i, ''), assetId: asset.id, z: d.z, role: d.role, scale: 1, x: 0, y: 0, blur: 0, opacity: 1, visible: true };
  };
})();

/* Motor de dibujo 2.5D: cámara, parallax, sobreescalado, huecos y transiciones.
   El visor y la exportación usan este mismo código (principio 4: lo que se ve es lo que se exporta). */
(function () {
  const MC = window.MC;
  const { clamp, lerp } = MC;

  const EASE = { linear: (t) => t, smooth: (t) => t * t * (3 - 2 * t), in: (t) => t * t, out: (t) => 1 - (1 - t) * (1 - t) };
  MC.ease = (k, t) => (EASE[k] || EASE.smooth)(clamp(t, 0, 1));
  const noise = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  MC.PARALLAX = { subtle: 0.5, normal: 1, wild: 1.6 };

  MC.shotStarts = (p) => { let t = 0; return p.shots.map((s) => { const a = t; t += s.duration; return a; }); };
  MC.totalTime = (p) => p.shots.reduce((a, s) => a + s.duration, 0);
  MC.locate = (p, time) => {
    let t = 0;
    for (let i = 0; i < p.shots.length; i++) {
      const d = p.shots[i].duration;
      if (time < t + d || i === p.shots.length - 1) return { i, tl: clamp(time - t, 0, d) };
      t += d;
    }
    return { i: 0, tl: 0 };
  };

  MC.camAt = (shot, tl, withShake) => {
    const c = shot.camera, d = Math.max(0.01, shot.duration), p = MC.ease(c.curve, tl / d);
    const z0 = c.from.zoom, z1 = c.to.zoom;
    const cam = { x: lerp(c.from.x, c.to.x, p), y: lerp(c.from.y, c.to.y, p), zoom: z0 * Math.pow(z1 / z0, p), rot: lerp(c.from.rot || 0, c.to.rot || 0, p), sx: 0, sy: 0 };
    if (withShake !== false && c.shake > 0) {
      const k = Math.floor(tl * 30), a = 0.012 * c.shake;
      cam.sx = (noise(k) - 0.5) * 2 * a;
      cam.sy = (noise(k + 99) - 0.5) * 2 * a;
      cam.rot += (noise(k + 7) - 0.5) * 2 * c.shake * 0.8;
    }
    return cam;
  };

  MC.layerGeom = (layer, img, cam, o) => {
    const I = o.parallaxI;
    return {
      f: 1 + (layer.z - 0.5) * I * 0.8, // cuánto se desplaza con la cámara
      zl: 1 + (cam.zoom - 1) * (1 + (layer.z - 0.5) * I * 0.6), // cuánto se acerca con el zoom
      base: Math.max(o.W / img.w, o.H / img.h) * (layer.scale || 1),
    };
  };

  /* Escala que necesita una capa de fondo para no dejar huecos durante todo el plano. */
  MC.coverNeeds = (layer, img, shot, o) => {
    const { W, H } = o, out = [];
    const shake = shot.camera.shake || 0;
    for (let k = 0; k <= 4; k++) {
      const cam = MC.camAt(shot, (shot.duration * k) / 4, false);
      const g = MC.layerGeom(layer, img, cam, o);
      const r = Math.abs(cam.rot) * Math.PI / 180 + shake * 0.8 * Math.PI / 180;
      const rk = Math.abs(Math.cos(r)) + Math.abs(Math.sin(r)) * Math.max(W / H, H / W);
      const camx = W / 2 + cam.x * W * g.f, camy = H / 2 + cam.y * H * g.f;
      const nx = Math.abs(W / 2 + (layer.x || 0) * W - camx) + (W / (2 * g.zl)) * rk + shake * 0.014 * W;
      const ny = Math.abs(H / 2 + (layer.y || 0) * H - camy) + (H / (2 * g.zl)) * rk + shake * 0.014 * H;
      out.push({ nx, ny, zl: g.zl });
    }
    return out;
  };
  MC.coverScale = (layer, img, shot, o) => {
    let s = 0;
    MC.coverNeeds(layer, img, shot, o).forEach((n) => { s = Math.max(s, n.nx / (img.w / 2), n.ny / (img.h / 2)); });
    return s * 1.003;
  };
  /* Escala con la que se dibuja la capa de verdad (incluye sobreescalado automático). */
  MC.effScale = (layer, img, shot, o) => {
    const base = Math.max(o.W / img.w, o.H / img.h) * (layer.scale || 1);
    return o.overscan && layer.role === 'fondo' ? Math.max(base, MC.coverScale(layer, img, shot, o)) : base;
  };
  /* Margen seguro del plano: cuánto se puede mover la cámara sin enseñar huecos (fracción del encuadre). Negativo = hay huecos. */
  MC.safeMargin = (shot, o) => {
    let mx = Infinity, my = Infinity, any = false;
    shot.layers.forEach((l) => {
      const img = o.getImg(l.assetId);
      if (!img || l.role !== 'fondo' || l.visible === false) return;
      any = true;
      const s = MC.effScale(l, img, shot, o);
      MC.coverNeeds(l, img, shot, o).forEach((n) => {
        mx = Math.min(mx, (img.w * s / 2 - n.nx) / o.W);
        my = Math.min(my, (img.h * s / 2 - n.ny) / o.H);
      });
    });

  };

  MC.renderShot = (ctx, shot, tl, o) => {
    const { W, H } = o;

      const s = MC.effScale(layer, img, shot, o);

      ctx.translate(-camx, -camy);

      ctx.restore();
    }
    ctx.restore();
  };

  MC.TRANSITIONS = [
    { v: 'cut', es: 'Corte', en: 'Cut' }, { v: 'fade', es: 'Fundido', en: 'Fade' },
    { v: 'flash', es: 'Destello', en: 'Flash' }, { v: 'wipe', es: 'Barrido', en: 'Wipe' },
  ];

  MC.renderFrame = (ctx, project, time, o) => {
    const { W, H } = o;
    const { i, tl } = MC.locate(project, time);
    const cur = project.shots[i];
    if (!cur) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); return; }
    const tr = cur.transition || { type: 'cut' };

    if (i > 0 && tr.type !== 'cut' && tl < dur) {
      const prev = project.shots[i - 1], p = tl / dur;

      const drawCur = () => MC.renderShot(ctx, cur, tl, o);
      const veil = (rgb, a) => { ctx.fillStyle = 'rgba(' + rgb + ',' + clamp(a, 0, 1) + ')'; ctx.fillRect(0, 0, W, H); };
      if (tr.type === 'fade') { if (p < 0.5) { drawPrev(); veil('0,0,0', p * 2); } else { drawCur(); veil('0,0,0', (1 - p) * 2); } return; }

        ctx.save(); ctx.translate(W * (1 - e), 0); drawCur(); ctx.restore();
        return;
      }
    }
    MC.renderShot(ctx, cur, tl, o);
  };

  MC.renderOpts = (project, extra) => {
    const s = MC.frameSize(project.ratio, project.res);
    return Object.assign({ W: s.w, H: s.h, getImg: (id) => MC.assets.get(id), parallaxI: MC.PARALLAX[project.parallax] || 1, overscan: project.overscan !== false }, extra || {});
  };

  MC.makeThumb = (project) => {
    try {
      const o = MC.renderOpts(project);
      const c = document.createElement('canvas');
      const k = 360 / Math.max(o.W, o.H);
      c.width = Math.round(o.W * k); c.height = Math.round(o.H * k);
      const ctx = c.getContext('2d');
      ctx.setTransform(k, 0, 0, k, 0, 0);
      const sh = project.shots[0];
      MC.renderFrame(ctx, project, sh ? Math.min(0.4, sh.duration * 0.1) : 0, o);
      return c.toDataURL('image/jpeg', 0.7);
    } catch (e) { return ''; }
  };
})();

    /* ---------- montaje de la interfaz ---------- */
    const fileLayers = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp,.psd,.pdf', multiple: true, hidden: true, id: 'f-layers', onChange: (e) => { importFiles(e.target.files, 'layers'); e.target.value = ''; } });
    const fileShots = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp,.psd,.pdf', multiple: true, hidden: true, id: 'f-shots', onChange: (e) => { importFiles(e.target.files, 'shots'); e.target.value = ''; } });
    el.top = h('div', { class: 's-top' });
    el.layersBody = h('div', { class: 'pbody' });
    el.inspBody = h('div', { class: 'pbody insp' });
    el.vbar = h('div', { class: 'vbar' });
    el.canvas = h('canvas', { 'aria-label': t('Visor del plano', 'Shot viewer') });
    el.empty = h('div', { class: 'drop' }, h('div', { class: 'in' }, MC.icon('image', 28),
      h('div', null, t('Arrastra aquí tus ilustraciones. Cada archivo será una capa.', 'Drag your artwork here. Each file becomes a layer.')),
      h('button', { class: 'btn btn-p', type: 'button', onClick: () => fileLayers.click() }, MC.icon('upload', 15), t('Importar', 'Import'))));
    el.stage = h('div', { class: 'stage' }, el.canvas, el.empty);
    el.play = h('button', { class: 'play', type: 'button', onClick: () => togglePlay() });
    el.loop = h('button', { class: 'btn btn-g btn-ic', type: 'button', title: t('Repetir', 'Loop'), 'aria-label': t('Repetir', 'Loop'), onClick: () => { S.loop = !S.loop; updateTransport(); } }, MC.icon('loop'));
    el.time = h('div', { class: 'num' });
    el.tlTime = h('span', { class: 'num' });
    el.tlLabels = h('div', { class: 'tl-labels' });
    el.tlContent = h('div', { class: 'tl-content' });

    const layersPanel = h('div', { class: 'panel-col p-layers' },
      h('div', { class: 'ph' }, h('span', { class: 'eyebrow' }, t('Capas', 'Layers')),
        h('button', { class: 'btn btn-s btn-sm', type: 'button', onClick: () => fileLayers.click() }, MC.icon('plus', 14), t('Importar', 'Import'))), el.layersBody);
    const viewer = h('div', { class: 'viewer' }, el.vbar, el.stage,
      h('div', { class: 'tbar' },
        h('button', { class: 'btn btn-g btn-ic', type: 'button', title: t('Ir al inicio (Inicio)', 'Go to start (Home)'), 'aria-label': t('Ir al inicio', 'Go to start'), onClick: () => setTime(0) }, MC.icon('first')),
        el.play, el.loop, el.time));
    const inspector = h('div', { class: 'panel-col p-inspector' }, h('div', { class: 'ph' }, h('span', { class: 'eyebrow' }, 'Inspector')), el.inspBody);
    const timeline = h('div', { class: 'p-timeline' },
      h('div', { class: 'tl-head' }, h('span', { class: 'eyebrow' }, t('Línea de tiempo', 'Timeline')),
        h('button', { class: 'btn btn-s btn-sm', type: 'button', onClick: () => fileShots.click() }, MC.icon('plus', 14), t('Planos desde imágenes', 'Shots from images')),
        h('button', { class: 'btn btn-g btn-ic', type: 'button', title: t('Alejar', 'Zoom out'), 'aria-label': t('Alejar', 'Zoom out'), onClick: () => { S.pps = clamp(S.pps / 1.3, 12, 240); renderTimeline(); } }, MC.icon('minus')),
        h('button', { class: 'btn btn-g btn-ic', type: 'button', title: t('Acercar', 'Zoom in'), 'aria-label': t('Acercar', 'Zoom in'), onClick: () => { S.pps = clamp(S.pps * 1.3, 12, 240); renderTimeline(); } }, MC.icon('plus')), el.tlTime),
      h('div', { class: 'tl-body' }, el.tlLabels, h('div', { class: 'tl-scroll' }, el.tlContent)));
    const mtabs = h('div', { class: 'mtabs' }, [['layers', t('Capas', 'Layers')], ['inspector', 'Inspector'], ['timeline', t('Línea', 'Timeline')]].map((x) =>
      h('button', { type: 'button', 'aria-pressed': String(S.mtab === x[0]), onClick: (e) => { S.mtab = x[0]; studio.dataset.mtab = x[0]; e.currentTarget.parentNode.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', 'false')); e.currentTarget.setAttribute('aria-pressed', 'true'); } }, x[1])));
    const studio = h('div', { class: 'studio', 'data-ws': S.ws, 'data-mtab': S.mtab }, el.top, h('div', { class: 's-main' }, layersPanel, viewer, inspector), mtabs, timeline, fileLayers, fileShots);

    function renderAll() { renderTop(); renderLayers(); renderInspector(); renderVbar(); renderTimeline(); updateTransport(); updateTime(); }
    MC.put(MC.clear(root), studio);
    renderAll(); wire(el.canvas); wireTimeline();

    el.stage.addEventListener('dragover', (e) => { e.preventDefault(); el.stage.classList.add('over'); });
    el.stage.addEventListener('dragleave', () => el.stage.classList.remove('over'));
    el.stage.addEventListener('drop', (e) => { e.preventDefault(); el.stage.classList.remove('over'); if (e.dataTransfer.files.length) importFiles(e.dataTransfer.files, 'layers'); });

    const ro = new ResizeObserver(() => fit());
    ro.observe(el.stage);
    requestAnimationFrame(fit);

    /* bucle de reproducción */
    let last = performance.now(), raf = 0;
    function loop(now) {
      if (!S.alive) return;
      raf = requestAnimationFrame(loop);
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      if (S.playing) {
        const total = MC.totalTime(S.project);
        let tm = S.time + dt;
        if (tm >= total) { if (S.loop) tm = 0; else { tm = Math.max(0, total - 0.001); S.playing = false; updateTransport(); } }
        setTime(tm);
      }
      if (S.dirty) { S.dirty = false; try { draw(); } catch (e) { console.error(e); } }
    }
    raf = requestAnimationFrame(loop);

    /* atajos de teclado */
    function onKey(e) {
      if (!S.alive || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
      const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
      if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
      else if (mod && k === 'y') { e.preventDefault(); redo(); }
      else if (mod) return;
      else if (k === ' ' || k === 'k') { e.preventDefault(); togglePlay(k === 'k' ? false : null); }
      else if (k === 'l') togglePlay(true);
      else if (k === 'j') setTime(S.time - 1);
      else if (k === 'arrowleft') setTime(S.time - (e.shiftKey ? 1 : 1 / 30));
      else if (k === 'arrowright') setTime(S.time + (e.shiftKey ? 1 : 1 / 30));
      else if (k === 'home') setTime(0);
      else if (k === 'c') { S.view = S.view === 'cam' ? 'out' : 'cam'; togglePlay(false); renderVbar(); fit(); }
      else if ((k === 'delete' || k === 'backspace') && layer()) { shot().layers.splice(S.li, 1); S.li = -1; commit(); }
    }
    document.addEventListener('keydown', onKey);
    const onHide = () => { if (document.visibilityState === 'hidden') save(); };
    document.addEventListener('visibilitychange', onHide);
    window.addEventListener('pagehide', save);
    function cleanup() { cancelAnimationFrame(raf); ro.disconnect(); document.removeEventListener('keydown', onKey); document.removeEventListener('visibilitychange', onHide); window.removeEventListener('pagehide', save); }
    MC.studioCleanup = () => { S.alive = false; cleanup(); };
  };
})();

/* Arranque de la aplicación. */
(function () {
  const MC = window.MC;
  const root = document.getElementById('app');

  MC.app = {
    async render() {
      if (MC.studioCleanup) { MC.studioCleanup(); MC.studioCleanup = null; }
      document.documentElement.lang = MC.lang;
      await MC.renderHome(root);
    },
    async openProject(p) {
      const full = (await MC.db.get('projects', p.id)) || p;
      await MC.mountStudio(root, full);
    },
  };

  async function boot() {
    MC.lang = MC.store.get('lang', (navigator.language || 'es').slice(0, 2) === 'en' ? 'en' : 'es');
    const th = MC.store.get('theme', '');
    if (th) document.documentElement.setAttribute('data-theme', th);
    await MC.db.ready();
    // primera vez: proyecto de ejemplo ya cargado
    if (!MC.store.get('seeded', '')) {
      const existing = await MC.db.all('projects');
      if (!existing.length) {
        try { const p = await MC.createSampleProject(MC.lang); await MC.db.put('projects', p); } catch (e) { console.error(e); }
      }
      MC.store.set('seeded', '1');
    }
    await MC.app.render();
    if (!window.MC_PREVIEW && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(() => { /* sin modo sin conexión */ });
    }
  }
  boot();
})();

</script>
